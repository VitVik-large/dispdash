<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITY Monitor</title>
<style>
  :root{--bg:#0f172a;--accent:#1e3a8a;--blue:#3b82f6;--orange:#f97316;--red:#ef4444;--green:#10b981}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:sans-serif;background:var(--bg);color:#fff;display:flex;overflow:hidden}
  .col{flex:1;padding:14px;display:flex;flex-direction:column;height:100vh;min-width:0;overflow:hidden}
  .left{background:#cbd5e1;color:#0f172a}
  .header{background:var(--accent);color:#fff;padding:12px 15px;border-radius:12px;margin-bottom:12px;flex-shrink:0}
  .header .top{display:flex;justify-content:space-between;align-items:center}
  .header .title{font-size:20px;font-weight:bold}
  .header .meta{font-size:12px;opacity:.8;margin-top:3px}
  .stat-row{display:flex;gap:14px;font-size:14px;flex-wrap:wrap;margin-top:6px}
  .cities{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;min-height:0}
  .ccard{background:#fff;padding:9px 14px;border-radius:12px;border-left:8px solid var(--accent);box-shadow:0 3px 5px rgba(0,0,0,.1)}
  .ccard .ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .ccard .cn{font-size:20px;font-weight:bold}
  .ccard .site{font-size:13px;color:#047857;font-weight:bold}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#f1f5f9;border-radius:8px;padding:4px 9px;font-size:13px;white-space:nowrap}
  .chip b{font-size:15px;margin:0 3px 0 5px}.chip i{opacity:.6;font-style:normal}
  .alerts{flex:1;min-height:0;background:#fff;border-radius:12px;border-left:8px solid #f43f5e;padding:8px 14px;display:flex;flex-direction:column;overflow:hidden}
  .alerts h2{margin:0 0 6px;font-size:17px;color:#f43f5e;flex-shrink:0}
  .alerts .body{flex:1;min-height:0;overflow:hidden}
  .alerts table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:clamp(11px,.85vw,14px)}
  .alerts th{background:#f1f5f9;font-size:11px;text-align:left;padding:3px 4px;white-space:nowrap;overflow:hidden}
  .alerts td{border-bottom:1px solid #eee;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .alerts tr.soon td.m{animation:blink 1.2s infinite}
  .m{text-align:right;font-weight:bold}.m.over{color:#dc2626}.m.ok{color:#d97706}
  .more{font-size:13px;opacity:.7;padding-top:3px}
  .count{text-align:center;color:#38bdf8;font-size:15px;font-weight:bold;margin-bottom:10px;flex-shrink:0}
  .legend{font-size:12px;text-align:center;opacity:.8;margin-bottom:8px;flex-shrink:0}
  .err{color:#f87171;font-size:12px;margin-top:5px;flex-shrink:0}
  .empty{opacity:.5;font-size:13px}
  .yard{flex:1;display:grid;gap:10px;min-height:0}
  .zone{background:#1e293b;border:2px solid #334155;border-radius:14px;padding:9px;display:flex;flex-direction:column;min-height:0;min-width:0}
  .zone h3{margin:0 0 7px;font-size:13px;letter-spacing:.5px;opacity:.85;flex-shrink:0;text-align:center}
  .zone h3 span{color:#38bdf8;margin-left:6px}
  .plates{flex:1;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px}
  .plate{padding:4px 9px;border-radius:5px;font-weight:800;font-size:12px;border:1px solid #0f172a;height:fit-content;white-space:nowrap}
  .plate.blue{background:var(--blue)}.plate.orange{background:var(--orange)}.plate.red{background:var(--red)}
  .plate.more{background:#475569;font-weight:700}
  .no-signal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center}
  .no-signal.show{display:flex}
  .no-signal-box{border:6px solid #ef4444;border-radius:20px;padding:50px 70px;text-align:center;animation:blink 1.5s infinite}
  .no-signal-box h1{font-size:56px;margin:0 0 20px;color:#ef4444;letter-spacing:4px}
  .no-signal-box p{font-size:24px;margin:0}
  .no-signal-box .sub{font-size:16px;opacity:.6;margin-top:16px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div class="no-signal" id="no-signal"><div class="no-signal-box">
  <h1>⚠ НЕТ СИГНАЛА</h1><p>Перезапусти скрипт hub.zammler (городской)</p><div class="sub" id="no-signal-detail"></div>
</div></div>

<div class="col left">
  <div class="header">
    <div class="top"><span class="title">Внутригородской монитор</span><span class="meta" id="time">—</span></div>
    <div class="meta" id="count">Загрузка...</div>
    <div class="stat-row" id="stats"></div>
  </div>
  <div class="cities" id="cities"></div>
  <div class="alerts">
    <h2>⚠️ ПРИБЫТИЕ В ТЕЧЕНИЕ 15 МИНУТ</h2>
    <div class="body" id="alerts"></div>
  </div>
</div>

<div class="col right">
  <div class="header">
    <div class="top"><span class="title">НА ТЕРРИТОРИИ</span><span class="meta" id="yard-time">—</span></div>
  </div>
  <div class="count" id="yard-count"></div>
  <div class="legend">🟧 погрузка &nbsp; 🟦 выгрузка / ожидание &nbsp; 🟥 время выезда по плану прошло</div>
  <div class="yard" id="yard"></div>
  <div class="err" id="err"></div>
</div>

<script>
// ====== НАСТРОЙ ПОД СЕБЯ ======
const DATA_URL = 'https://script.google.com/macros/s/AKfycbwQ5L-KaRgs4NGxzjuUKydye-n4PdzJcunz_yFl5l7Nvta5LIA6GHTxZcA_8IbKTEqWTg/exec';
const TOKEN = 'aV4$rUd8';
const POLL_MS = 15000;
const ALERT_MIN = 15, OVERDUE_MIN = 30;
const CITIES_PER_PAGE = 4, ROTATE_MS = 8000;
// ================================

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let data = null, curC = 0;

function renderCities() {
  const list = (data && data.cities) || [];
  if (!list.length) { $('cities').innerHTML = '<div class="empty">Нет активных рейсов</div>'; return; }
  if (curC >= list.length) curC = 0;
  $('cities').innerHTML = list.slice(curC, curC + CITIES_PER_PAGE).map((c) => `
    <div class="ccard"><div class="ct"><span class="cn">${esc(c.n)}</span>
      <span class="site">на территории: ${c.onSite || 0}</span></div>
      <div class="chips">${c.rows.map((r) => `<span class="chip">${esc(r.s)}<b>${r.v}</b><i>${r.orders} зак.</i></span>`).join('')}</div>
    </div>`).join('');
}
setInterval(() => {
  const n = ((data && data.cities) || []).length;
  if (n <= CITIES_PER_PAGE) { curC = 0; } else { curC += CITIES_PER_PAGE; if (curC >= n) curC = 0; }
  renderCities();
}, ROTATE_MS);

function renderAlerts() {
  const el = $('alerts');
  if (!data) return;
  const now = Date.now();
  const rows = (data.lates || []).map((l) => ({ ...l, m: Math.round((l.ts - now) / 60000) }))
    .filter((l) => l.m <= ALERT_MIN && l.m >= -OVERDUE_MIN)
    .sort((a, b) => (a.m >= 0) === (b.m >= 0) ? (a.m >= 0 ? a.m - b.m : b.m - a.m) : (a.m >= 0 ? -1 : 1)); // сначала ближайшие, потом опоздавшие
  if (!rows.length) { el.innerHTML = '<div class="empty">Нет прибытий в ближайшие 15 минут</div>'; return; }
  const tr = (l) => `<tr class="${l.m >= 0 && l.m <= 5 ? 'soon' : ''}"><td><b>${esc(l.to)}</b></td><td>${esc(l.city)}</td><td>${esc(l.car)}</td>
    <td>${esc(l.drv)}</td><td>${esc(l.plan)}</td><td align="right">${l.orders || 0}</td>
    <td class="m ${l.m < 0 ? 'over' : 'ok'}">${l.m < 0 ? '−' + (-l.m) : 'через ' + l.m} мин</td></tr>`;
  const head = '<colgroup><col style="width:15%"><col style="width:11%"><col style="width:14%"><col style="width:27%"><col style="width:8%"><col style="width:10%"><col style="width:15%"></colgroup><tr><th>ТОЧКА</th><th>ГОРОД</th><th>МАШИНА</th><th>ВОДИТЕЛЬ</th><th>ПЛАН</th><th style="text-align:right">ЗАКАЗЫ</th><th style="text-align:right">ОСТ.</th></tr>';
  const draw = (n) => {
    el.innerHTML = `<table>${head}${rows.slice(0, n).map(tr).join('')}</table>` +
      (n < rows.length ? `<div class="more">+ ещё ${rows.length - n}</div>` : '');
  };
  let n = rows.length;
  draw(n);
  while (n > 1 && el.scrollHeight > el.clientHeight + 1) { n--; draw(n); }
}

const fillZone = (el, items) => {
  const h = (p) => `<div class="plate ${esc(p.cl)}">${esc(p.n)}</div>`;
  if (!items.length) { el.innerHTML = '<div class="empty">—</div>'; return; }
  el.innerHTML = items.map(h).join('');
  let shown = items.length;
  while (shown > 0 && el.scrollHeight > el.clientHeight + 1) {
    shown--;
    el.innerHTML = items.slice(0, shown).map(h).join('') + `<div class="plate more">+${items.length - shown}</div>`;
  }
};

function renderYard() {
  const zones = (data && data.zones) || [];
  const y = $('yard');
  const total = zones.reduce((s, z) => s + z.plates.length, 0);
  $('yard-count').textContent = `Всего на территории: ${total}`;
  if (!zones.length) { y.style.gridTemplateColumns = '1fr'; y.innerHTML = '<div class="empty" style="text-align:center;padding-top:40px">На территории машин нет</div>'; return; }
  const n = zones.length;
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4;
  y.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
  y.style.gridAutoRows = '1fr';
  y.innerHTML = zones.map((z, i) => `<div class="zone"><h3>${esc(z.city.toUpperCase())} · ${esc(z.zone.toUpperCase())}<span>${z.plates.length}</span></h3><div class="plates" id="zp${i}"></div></div>`).join('');
  zones.forEach((z, i) => fillZone($('zp' + i), z.plates));
}

function render() {
  $('err').textContent = '';
  const t = 'ОБНОВЛЕНО: ' + new Date(data.updatedAt).toLocaleTimeString();
  $('time').textContent = t; $('yard-time').textContent = t;
  $('count').textContent = 'ЗАГРУЖЕНО: ' + data.total;
  $('stats').innerHTML = Object.keys(data.stats || {}).map((s) => `<div>${esc(s)}:<b> ${data.stats[s]}</b></div>`).join('') || 'Нет данных';
  renderCities(); renderAlerts(); renderYard();
}
setInterval(renderAlerts, 20000); // минуты до прибытия пересчитываются сами
window.addEventListener('resize', () => { if (data) { renderAlerts(); renderYard(); } });

// --- страховки "нет сигнала" ---
const HEARTBEAT_MS = 5 * 60 * 1000;   // коллектор шлёт раз в минуту
const CONTENT_STALE_MS = 3 * 60 * 60 * 1000;
let lastUpdatedAt = null, lastSig = null, lastChangeAt = Date.now();

function checkSignal() {
  const hb = lastUpdatedAt ? Date.now() - new Date(lastUpdatedAt).getTime() : 0;
  const ct = Date.now() - lastChangeAt;
  const hbDead = lastUpdatedAt !== null && hb > HEARTBEAT_MS;
  const ctDead = ct > CONTENT_STALE_MS;
  $('no-signal').classList.toggle('show', hbDead || ctDead);
  if (hbDead) $('no-signal-detail').textContent = `Последний снепшот пришёл ${Math.round(hb / 60000)} мин назад — скорее всего скрипт остановлен`;
  else if (ctDead) $('no-signal-detail').textContent = `Коллектор жив, но данные не менялись ${(ct / 3600000).toFixed(1)} ч — проверь источник`;
}
setInterval(checkSignal, 10000);

async function poll() {
  try {
    const res = await fetch(`${DATA_URL}?token=${encodeURIComponent(TOKEN)}`);
    const d = await res.json();
    if (d.ok === false) $('err').textContent = 'Ошибка: ' + d.error;
    else if (d.empty) $('err').textContent = 'Ждём первый снепшот от коллектора...';
    else {
      data = d; lastUpdatedAt = d.updatedAt;
      const sig = JSON.stringify({ s: d.stats, c: d.cities, z: d.zones });
      if (sig !== lastSig) { lastSig = sig; lastChangeAt = Date.now(); }
      render();
    }
  } catch (e) {
    $('err').textContent = 'Не удалось загрузить данные: ' + e;
  } finally { checkSignal(); setTimeout(poll, POLL_MS); }
}
poll();
</script>
</body>
</html>
